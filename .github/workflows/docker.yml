name: Build Docker images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  # Rebuild weekly so the image picks up Alpine security updates.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Full image: Guacamole plus an embedded MariaDB.
          - variant: mariadb
            target: mariadb
            suffix: ''
          # Slim image for users who bring their own database.
          - variant: nomariadb
            target: nomariadb
            suffix: '-nomariadb'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect build metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail

          # The Guacamole version is defined once, in the Dockerfile.
          guac_ver="$(awk -F= '/^ARG GUAC_VER=/{print $2; exit}' Dockerfile)"
          if [ -z "$guac_ver" ]; then
            echo "::error file=Dockerfile::Unable to determine GUAC_VER"
            exit 1
          fi
          echo "guac_ver=$guac_ver" >> "$GITHUB_OUTPUT"

          images=("ghcr.io/${GITHUB_REPOSITORY,,}")
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images+=("docker.io/${DOCKERHUB_REPOSITORY:-$DOCKERHUB_USERNAME/guacamole}")
          fi

          {
            echo 'tags<<TAGS_EOF'
            for image in "${images[@]}"; do
              echo "${image}:${guac_ver}${SUFFIX}"
              echo "${image}:latest${SUFFIX}"
            done
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

          # Only publish from the default branch and from release tags.
          if [ "${GITHUB_EVENT_NAME}" != 'pull_request' ] &&
             { [ "${GITHUB_REF}" = 'refs/heads/master' ] || [ "${GITHUB_REF#refs/tags/v}" != "${GITHUB_REF}" ]; }; then
            echo 'push=true' >> "$GITHUB_OUTPUT"
            echo 'platforms=linux/amd64,linux/arm64' >> "$GITHUB_OUTPUT"
          else
            echo 'push=false' >> "$GITHUB_OUTPUT"
            # Branch and pull request builds only verify amd64; emulating arm64
            # for a verification-only build is not worth the runner minutes.
            echo 'platforms=linux/amd64' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Summary
        env:
          GUAC_VER: ${{ steps.meta.outputs.guac_ver }}
          PUSHED: ${{ steps.meta.outputs.push }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.variant }} image"
            echo
            echo "Apache Guacamole \`${GUAC_VER}\`"
            echo
            if [ "$PUSHED" = 'true' ]; then
              echo 'Published tags:'
            else
              echo 'Build only, not published. Tags that would have been used:'
            fi
            echo
            echo "$TAGS" | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
